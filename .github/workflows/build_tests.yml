name: Build Tests

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install
        run: |
          sudo apt -y update
          sudo apt -y install gcc-arm-none-eabi

      - name: Initialize Submodules
        run: git submodule update --init Firmware/Embedded-Sharepoint

      - name: Clean
        run: |
          cd Firmware/
          make clean
      
      - name: Build tests
        run: |
          cd Firmware/Tests/
          python3 makeAllTests.py
